name: upstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream garage version, e.g. 2.5.0. Empty means the latest stable release."
        required: false
        default: ""

permissions: {}

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the upstream release
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: ci/upstream-check.sh "$INPUT_VERSION"
      - name: Open the update pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          URL: ${{ steps.check.outputs.url }}
          BRANCH: upstream/v${{ steps.check.outputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::notice::${BRANCH} already exists, leaving it alone"
            exit 0
          fi
          git config user.name "bor"
          git config user.email "me@bor691.ir"
          git switch -c "$BRANCH"
          git add debian/changelog checksums README.md
          git commit -m "Update to garage ${VERSION}"
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Update to garage ${VERSION}" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Upstream release: ${URL}" \
              "Generated by ci/upstream-check.sh. It pins the amd64 and arm64 checksums, adds the changelog entry, and updates the README examples." \
              "Before merging: review the release notes for breaking changes, re-sign the commit locally, and force-push the branch.")"
